name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts && npm rebuild argon2
      - run: npx tsc -b
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts && npm rebuild argon2
      - run: npm run typecheck
      # Runs on the dist/ the typecheck built. Fails when an API operation has
      # no AI tool policy entry, or when the committed catalog is stale.
      - name: AI tool policy and catalog
        run: |
          npm run codegen:ai-tools --workspace=@evtivity/api
          git diff --exit-code -- packages/api/src/services/ai/tools/catalog.ts

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts && npm rebuild argon2
      - run: npm run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts && npm rebuild argon2
      - run: npm test -- --coverage
      - run: npm run test:release
      - run: bash scripts/docker-build.test.sh
      # The image build context (.dockerignore) leaves local secrets out: a seed
      # config, an env file and a test certificate planted here never reach it.
      - name: Docker build context
        run: |
          echo '{}' > packages/database/seed.config.json
          echo 'PLANTED=1' > .env.local
          echo 'PLANTED=1' > packages/api/.env
          mkdir -p packages/css/test-certs && echo planted > packages/css/test-certs/ca.pem
          printf '%s\n' \
            'FROM busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e' \
            'COPY . /ctx' \
            'RUN test ! -e /ctx/packages/database/seed.config.json && test ! -e /ctx/.env.local && test ! -e /ctx/packages/api/.env && test ! -e /ctx/packages/css/test-certs' \
            | docker build -q -f - .
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && hashFiles('coverage/index.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  coverage-badge:
    name: Coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage
      - run: node scripts/coverage-summary.mjs coverage/coverage-summary.json --badge "$RUNNER_TEMP/coverage.json" > /dev/null
      - name: Publish the badge to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git checkout -B badges FETCH_HEAD
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update the coverage badge"
          git push origin badges

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=high

  build:
    name: Build bundles
    runs-on: ubuntu-latest
    # Normally done in a few minutes. Fail fast when the install hangs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/build.mjs all

  wasm:
    name: EXI codec reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rebuilds packages/v2g-exi/wasm/v2g_exi.wasm from the pinned libcbv2g
      # release with the pinned Emscripten image and fails when it differs
      # from the committed module.
      - run: bash packages/v2g-exi/scripts/build-wasm.sh --check
