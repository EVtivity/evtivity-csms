name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/evtivity/evtivity-csms

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  # Four channels: stable (v0.1.38), alpha (v0.1.39-alpha.1), beta (v0.1.38-beta.2)
  # and nightly (v0.1.38-nightly.7). An alpha, beta or nightly is a prerelease:
  # exact-version images plus its channel alias, a GitHub prerelease, and no Helm
  # chart or CDK bump.
  # scripts/release-version.sh holds the tag grammar and rejects other labels.
  prepare:
    name: Resolve release type
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.type.outputs.prerelease }}
      channel: ${{ steps.type.outputs.channel }}
    steps:
      - uses: actions/checkout@v5

      - name: Classify tag
        id: type
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          source scripts/release-version.sh
          if ! release_tag_is_valid "$REF_NAME"; then
            echo "::error::$REF_NAME is not v + semver (v1.2.3 or v1.2.3-<prerelease>)"
            exit 1
          fi
          if release_tag_is_prerelease "$REF_NAME"; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          CHANNEL=$(release_tag_channel "$REF_NAME")
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "${REF_NAME}: prerelease=${PRERELEASE} channel=${CHANNEL:-none}" >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            dockerfile: packages/api/Dockerfile
            description: EVtivity CSMS REST API
          - image: ocpp
            dockerfile: packages/ocpp/Dockerfile
            description: EVtivity CSMS OCPP WebSocket server
          - image: ocpi
            dockerfile: packages/ocpi/Dockerfile
            description: EVtivity CSMS OCPI roaming server
          - image: csms
            dockerfile: packages/csms/Dockerfile
            description: EVtivity CSMS operator dashboard
          - image: portal
            dockerfile: packages/portal/Dockerfile
            description: EVtivity CSMS driver portal
          - image: migrate
            dockerfile: packages/database/Dockerfile
            description: EVtivity CSMS database migrations
          - image: css
            dockerfile: packages/css/Dockerfile
            description: EVtivity CSMS charging station simulator
          - image: worker
            dockerfile: packages/worker/Dockerfile
            description: EVtivity CSMS background job worker
          - image: ocpi-simulator
            dockerfile: packages/ocpi-simulator/Dockerfile
            description: EVtivity CSMS OCPI roaming simulator

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # docker/metadata-action already extends only {{version}} for a semver
          # prerelease and gives it no latest tag (procSemver in src/meta.ts). The
          # flavor and enable conditions state the same rule explicitly, so a
          # prerelease never moves {{major}}.{{minor}}, {{major}} or latest.
          flavor: |
            latest=${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=stable,enable=${{ needs.prepare.outputs.channel == 'stable' }}
            type=raw,value=alpha,enable=${{ needs.prepare.outputs.channel == 'alpha' }}
            type=raw,value=beta,enable=${{ needs.prepare.outputs.channel == 'beta' }}
            type=raw,value=nightly,enable=${{ needs.prepare.outputs.channel == 'nightly' }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=evtivity-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/EVtivity/evtivity-csms
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.vendor=EVtivity

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Stable: previous stable tag, so the notes cover everything since the last
      # stable release. Prerelease: previous tag of any kind, so the notes cover
      # only what changed since the last tested build.
      - name: Find previous tag
        id: prev_tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          source scripts/release-version.sh
          PREV=$(release_previous_tag "$REF_NAME")
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          BODY=$(./scripts/generate-changelog.sh "${{ steps.prev_tag.outputs.tag }}" "${{ github.ref_name }}")
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.body }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # A prerelease is never marked Latest: no --latest flag, and GitHub
          # does not mark a prerelease as Latest.
          if [ "$PRERELEASE" = true ]; then
            gh release create "$REF_NAME" --prerelease --notes "$RELEASE_NOTES"
          else
            gh release create "$REF_NAME" --notes "$RELEASE_NOTES"
          fi

  update-helm-chart:
    name: Update Helm chart appVersion
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push, github-release]
    # Stable releases only: a prerelease never moves the chart version.
    if: startsWith(github.ref, 'refs/tags/v') && needs.prepare.outputs.prerelease == 'false'
    steps:
      - name: Checkout helm chart repo
        uses: actions/checkout@v5
        with:
          repository: EVtivity/evtivity-csms-helm
          token: ${{ secrets.HELM_REPO_PAT }}

      - name: Update Chart.yaml
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          sed -i "s/^version:.*/version: $VERSION/" Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" Chart.yaml

      - name: Commit and push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Chart.yaml
          if git diff --cached --quiet; then
            echo "Chart.yaml already up to date"
          else
            git commit -m "Releasing version $VERSION"
            git push
          fi

  update-cdk-repo:
    name: Update CDK image tag
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push, github-release]
    # Stable releases only: a prerelease never moves the dev, qa or prod image tag.
    if: startsWith(github.ref, 'refs/tags/v') && needs.prepare.outputs.prerelease == 'false'
    steps:
      - name: Checkout cdk repo
        uses: actions/checkout@v5
        with:
          repository: EVtivity/evtivity-csms-cdk
          token: ${{ secrets.CDK_REPO_PAT }}

      - name: Update image tag in env configs
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          # Docker images are tagged via docker/metadata-action with
          # pattern={{version}}, which strips the v prefix. Strip it here too
          # so the CDK config matches the actual published image tag.
          # Only the shared image.tag moves. Per-service imageTag pins are
          # deliberate overrides and stay as they are.
          VERSION="${REF_NAME#v}"
          for f in config/dev.yaml config/qa.yaml config/prod.yaml; do
            if [ -f "$f" ]; then
              VERSION="$VERSION" yq -i '.image.tag = strenv(VERSION)' "$f"
            fi
          done

      - name: Update package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}" node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit and push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/ package.json
          if git diff --cached --quiet; then
            echo "CDK configs already up to date"
          else
            git commit -m "Releasing version $VERSION"
            git push
          fi
