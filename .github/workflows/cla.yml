name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

env:
  # The one signature sentence: the comment gate below and the CLA action both match it.
  CLA_SIGN_COMMENT: 'I have read the CLA Document and I hereby sign the CLA'

jobs:
  # A signature comment counts when it is the sentence alone, with any surrounding whitespace
  # (a trailing line break included) and in any letter case, the way the CLA action matches it
  # (trimmed, lower case). Any other text in the comment does not count.
  signature-comment:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      signed: ${{ steps.match.outputs.signed }}
    steps:
      - id: match
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          body="$COMMENT_BODY"
          body="${body#"${body%%[![:space:]]*}"}"
          body="${body%"${body##*[![:space:]]}"}"
          if [ "${body,,}" = "${CLA_SIGN_COMMENT,,}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

  cla:
    needs: signature-comment
    runs-on: ubuntu-latest
    if: |
      !cancelled() && (
        github.event_name == 'pull_request_target' ||
        (github.event_name == 'issue_comment' && needs.signature-comment.outputs.signed == 'true')
      )
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          path-to-document: 'CLA.md'
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],renovate[bot]'
          custom-notsigned-prcomment: 'Thank you for your contribution. Before we can merge this PR, you need to sign the Contributor License Agreement (CLA.md). To sign, please comment on this PR with: `${{ env.CLA_SIGN_COMMENT }}`. This is a one-time requirement.'
          custom-pr-sign-comment: ${{ env.CLA_SIGN_COMMENT }}
          lock-pullrequest-aftermerge: false
