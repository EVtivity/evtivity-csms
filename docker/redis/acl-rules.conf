# Redis users of the EVtivity services. Docker Compose loads this file through
# docker/redis/start.sh. The Helm chart (redis/acl-rules.conf) and the CDK app
# (config/redis-acl-rules.conf) carry identical copies.
#
# Format: one "user <name> <rules>" line per service, Redis ACL syntax without
# "on", passwords or reset rules. Each deployment adds those itself.
# Keys (~, %R~) are exact per process. api, ocpp and worker share one channel set
# (they run shared code that publishes across it); ocpi and css get exact sets.
# Commands: everything except @dangerous, plus INFO (BullMQ and ioredis read it).
user api ~rc:* ~attest:nonce:* %R~evtivity:payments:process-version-watch &cache_invalidate &csms_events &fleet_billing_fanout &maintenance_fanout &ocpi_push &ocpi_register &ocpi_sync &ocpp_command_results &ocpp_commands &octt_run &payment_webhook_deliveries &pnc_commands &pnc_command_results &portal_events &remote_start_timeout &report_generate &reservation_schedule &session_end_requests &station_message_refresh &station_message_repush &station_message_transaction &station_watch_available &css_commands &css_command_results +@all -@dangerous +info
user ocpp ~ocpp:conn:* &cache_invalidate &csms_events &fleet_billing_fanout &maintenance_fanout &ocpi_push &ocpi_register &ocpi_sync &ocpp_command_results &ocpp_commands &octt_run &payment_webhook_deliveries &pnc_commands &pnc_command_results &portal_events &remote_start_timeout &report_generate &reservation_schedule &session_end_requests &station_message_refresh &station_message_repush &station_message_transaction &station_watch_available +@all -@dangerous +info
user worker ~bull:* ~mfl:* ~sml:* ~evtivity:payments:process-version-watch %R~ocpp:conn:* &cache_invalidate &csms_events &fleet_billing_fanout &maintenance_fanout &ocpi_push &ocpi_register &ocpi_sync &ocpp_command_results &ocpp_commands &octt_run &payment_webhook_deliveries &pnc_commands &pnc_command_results &portal_events &remote_start_timeout &report_generate &reservation_schedule &session_end_requests &station_message_refresh &station_message_repush &station_message_transaction &station_watch_available +@all -@dangerous +info
user ocpi ~opl:* ~bull:ocpi-cdrs:* &ocpp_commands &ocpp_command_results &csms_events &ocpi_push &ocpi_sync &ocpi_register +@all -@dangerous +info
user css &css_commands &css_command_results +@all -@dangerous +info
