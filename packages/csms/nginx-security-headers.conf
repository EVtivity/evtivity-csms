# Security headers of every CSMS page response. Included in each
# location of nginx.conf and nginx.dev.conf: nginx does not inherit add_header
# into a location that sets its own. The Helm chart renders the same headers
# (templates/csms-nginx-configmap.yaml): change both together.
# frame-ancestors only works as a header, never in a meta tag.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.googletagmanager.com https://maps.googleapis.com https://js.stripe.com https://m.stripe.network https://*.adyen.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://maps.gstatic.com https://maps.googleapis.com https://*.ggpht.com https://*.googleusercontent.com https://*.amazonaws.com https://*.stripe.com https://*.adyen.com; connect-src 'self' http: https:; frame-src 'self' https://www.google.com/recaptcha/ https://www.google.com/maps/ https://js.stripe.com https://hooks.stripe.com https://m.stripe.network https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# The origin only, and only over HTTPS: Google Maps keys restricted by referrer
# need the origin (no-referrer breaks them).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers apply it only to responses they received over HTTPS (behind the
# TLS-terminating load balancer) and ignore it on plain HTTP.
add_header Strict-Transport-Security "max-age=31536000" always;
