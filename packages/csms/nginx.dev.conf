server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check for the load balancer and container orchestrator.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Written at container start by /docker-entrypoint.d/40-runtime-config.sh into /tmp,
    # which stays writable when the root filesystem is read-only.
    location = /runtime-config.js {
        alias /tmp/evtivity/runtime-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Docker Compose has no load balancer in front, so nginx forwards API calls itself.
    # A literal hostname in proxy_pass is resolved once at startup, so a restarted
    # api or ocpp container (new IP) answered 502 until this container restarted.
    # With the upstream in a variable, nginx resolves it through Docker's embedded
    # DNS and re-resolves after 10s. The variable carries no URI part, so nginx
    # passes the request URI (path and query) unchanged, as before.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /v1 {
        set $api_upstream http://api:7102;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ocpp {
        set $ocpp_upstream http://ocpp:7103;
        proxy_pass $ocpp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Hashed bundle output (Vite emits content-hashed filenames in /assets/).
    # Safe to cache aggressively because a content change produces a new
    # filename; the index.html will reference the new hash.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html and the SPA fallback. Must NEVER be cached -- if the browser
    # holds a stale index.html it references chunk hashes that no longer
    # exist on disk, causing "Failed to fetch dynamically imported module"
    # after a rebuild.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
